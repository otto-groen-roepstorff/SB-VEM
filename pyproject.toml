[project]
name = "overcomplete_learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ipykernel>=6.31.0",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "pip>=26.0.1",
    "scikit-learn>=1.6.1",
    "scipy>=1.13.1",
    "sympy>=1.14.0",
    "tqdm>=4.67.3",
]
[tool.setuptools.packages.find]
where = ["src"]
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"